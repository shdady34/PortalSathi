<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
  <meta charset="UTF-8">
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      width: 320px; 
      padding: 12px; 
      background-color: #f3f4f6; 
      margin: 0; 
    }
    /* --- CUSTOM THICK DARK SCROLLBAR --- */
::-webkit-scrollbar {
  width: 10px; /* Thicker scrollbar */
}
::-webkit-scrollbar-track {
  background: #e0e0e0; /* Light gray track */
  border-radius: 4px;
}
::-webkit-scrollbar-thumb {
  background: #4a4a4a; /* Darker, highly visible thumb */
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #2a2a2a; /* Even darker on hover */
}

/* --- NEW BUTTON STYLES --- */
.button-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.btn-primary {
  flex: 1;
  background-color: #0066ff;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

.btn-danger {
  flex: 1;
  background-color: #dc3545; /* Red for erase/delete */
  color: white;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

.btn-danger:hover {
  background-color: #c82333;
}

/* --- SUB-BOX & FEEDBACK STYLING --- */
.vault-sub-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}

.vault-sub-box input, .vault-sub-box select, .vault-sub-box textarea {
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-family: inherit;
}

.feedback-card {
  text-align: center;
  background-color: #f8f9fa;
  border: 1px dashed #ccc;
}

.btn-outline {
  background: transparent;
  border: 1px solid #555;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 5px;
}
    /* Standard Button Styling */
    button { 
      background: #1a73e8; 
      color: white; 
      border: none; 
      padding: 8px; 
      width: 100%; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      transition: background 0.2s; 
    }
    button:hover { background: #1557b0; }
    
    /* Specific Button Colors */
    #reportBtn { background: #d93025; margin-bottom: 0;}
    #reportBtn:hover { background: #b3261e; }
    
    #fillVaultBtn { background: #0f9d58; }
    #fillVaultBtn:hover { background: #0b8043; }
    
    #saveVaultBtn { 
      background: #f1f3f4; 
      color: #3c4043; 
      border: 1px solid #dadce0; 
    }
    #saveVaultBtn:hover { background: #e8eaed; }

    .row { display: flex; gap: 8px; margin-top: 4px;}
    #status { font-size: 12px; color: #0f9d58; font-weight: bold; margin-top: 5px; text-align: center;}
  </style>
</head>
<body>

  <div class="app-header">
    <h2>PortalSathi</h2>
    <span id="radarBadge" class="badge-warning">⚠️ Checking...</span>
  </div>
  
  <!-- Card 1: Ghost Save -->
  <div class="card">
    <h3>Form Timeout Recovery</h3>
    <button id="restoreBtn">Restore Form Data</button>
  </div>

  <!-- Card 2: Image Formatter -->
  <div class="card">
    <h3>Smart Image Formatter</h3>
    <select id="imagePreset">
      <option value="compress">Standard Compress (< 50KB)</option>
      <option value="passport">Passport Photo (200x230 px)</option>
      <option value="signature">Signature Crop (140x60 px)</option>
    </select>
    <input type="file" id="imageInput" accept="image/*">
    <button id="compressBtn">Format & Download</button>
    <div id="status"></div>
  </div>

  <!-- Card 3: Profile Vault -->
<div class="card">
  <h3>Local Profile Vault</h3>
  <div class="vault-sub-box">
    <input type="text" id="vaultName" placeholder="Full Name">
    <input type="text" id="vaultFather" placeholder="Father's Name">
    <input type="tel" id="vaultPhone" placeholder="Phone Number">
    
    <!-- DOB with Calendar Picker -->
    <label for="vaultDob" style="font-size: 12px; color: #555; margin-left: 4px;">Date of Birth:</label>
    <input type="date" id="vaultDob">
    
    <!-- Gender Dropdown -->
    <select id="vaultGender">
      <option value="" disabled selected>Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <textarea id="vaultAddress" placeholder="Permanent Address" rows="2"></textarea>
  </div>

  <div class="button-group">
    <button id="btnSaveAutofill" class="btn-primary">Save & Auto-Fill</button>
    <button id="btnEraseData" class="btn-danger">Erase Data</button>
  </div>
</div>

<!-- Feedback Section -->
<div class="card feedback-card">
  <p>Is PortalSathi working fine on this portal?</p>
  <button id="btnFeedback" class="btn-outline">Give Feedback</button>
</div>

  <!-- Card 4: Scam Reporter -->
  <div class="card">
    <h3>Community Safety</h3>
    <button id="reportBtn">🚨 Report Fake/Scam Site</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
